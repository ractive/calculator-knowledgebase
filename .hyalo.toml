dir = "wiki"
format = "text"

[schema.default]
required = ["title", "type"]

[schema.types.source]
required = ["title", "type", "authors", "year", "raw", "status", "tags"]

[schema.types.source.properties.status]
type = "enum"
values = ["unread", "skimmed", "digested"]

[schema.types.source.properties.year]
type = "number"

[schema.types.source.properties.authors]
type = "list"

[schema.types.source.properties.tags]
type = "list"

[schema.types.source.properties.models]
type = "string-list"
item_pattern = "^(48sx|48gx|49g|38g|39g|40g|42s)$"

[schema.types.hardware]
required = ["title", "type", "models", "status", "sources", "tags"]

[schema.types.hardware.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.hardware.properties.models]
type = "string-list"
item_pattern = "^(48sx|48gx|49g|38g|39g|40g|42s)$"

[schema.types.hardware.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.hardware.properties.tags]
type = "list"

[schema.types.model]
required = ["title", "type", "models", "status", "sources", "tags"]

[schema.types.model.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.model.properties.models]
type = "string-list"
item_pattern = "^(48sx|48gx|49g|38g|39g|40g|42s)$"

[schema.types.model.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.model.properties.tags]
type = "list"

[schema.types.rom-behaviour]
required = ["title", "type", "models", "status", "sources", "tags"]

[schema.types.rom-behaviour.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.rom-behaviour.properties.models]
type = "string-list"
item_pattern = "^(48sx|48gx|49g|38g|39g|40g|42s)$"

[schema.types.rom-behaviour.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.rom-behaviour.properties.tags]
type = "list"

[schema.types.protocol]
required = ["title", "type", "status", "sources", "tags"]

[schema.types.protocol.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.protocol.properties.models]
type = "string-list"
item_pattern = "^(48sx|48gx|49g|38g|39g|40g|42s)$"

[schema.types.protocol.properties.sources]
type = "string-list"
item_pattern = "^\\[\\[sources/[a-z0-9-]+\\]\\]$"

[schema.types.protocol.properties.tags]
type = "list"

[schema.types.file-format]
required = ["title", "type", "status", "sources", "tags"]

[schema.types.file-format.properties.status]
type = "enum"
