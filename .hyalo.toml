dir = "wiki"
format = "text"

[schema.default]
required = ["title", "type"]

[schema.types.source]
required = ["title", "type", "authors", "year", "raw", "status", "tags"]

[schema.types.source.properties.status]
type = "enum"
values = ["unread", "skimmed", "digested"]

[schema.types.source.properties.year]
type = "number"

[schema.types.hardware]
required = ["title", "type", "models", "status", "sources", "tags"]

[schema.types.hardware.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.protocol]
required = ["title", "type", "status", "sources", "tags"]

[schema.types.protocol.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.emulator-note]
required = ["title", "type", "emulator", "status", "tags"]

[schema.types.emulator-note.properties.status]
type = "enum"
values = ["stub", "draft", "reviewed"]

[schema.types.decision]
required = ["title", "type", "date", "status", "tags"]

[schema.types.decision.properties.status]
type = "enum"
values = ["proposed", "accepted", "superseded"]

[schema.types.decision.properties.date]
type = "date"

[schema.types.question]
required = ["title", "type", "status", "tags"]

[schema.types.question.properties.status]
type = "enum"
values = ["open", "answered"]

[schema.types.synthesis]
required = ["title", "type", "date", "sources", "tags"]

[schema.types.synthesis.properties.date]
type = "date"

[schema.types.meta]
required = ["title", "type"]

[views.stubs]
properties = ["status=stub"]

[views.unread]
properties = ["type=source", "status=unread"]

[views.open-questions]
properties = ["type=question", "status=open"]

[views.orphans]
orphan = true
